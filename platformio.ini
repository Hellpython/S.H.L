; 어린이 키링 BLE 경고 1차 프로토타입
; 실제 보드 모델은 연구실에서 확인 전이다. 발표 자료의 "ESP32 DevKitC"를
; 가정해 esp32dev(ESP32-WROOM 계열)로 빌드한다. 보드가 다르면 board 값을 바꾼다.
;
; 빌드:  pio run -e keyring   /  pio run -e roadside
; 업로드: pio run -e keyring -t upload --upload-port <포트>

[env]
; 설치돼 있는 버전으로 고정 (Arduino-ESP32 core 2.0.17).
; core 3.x는 BLE API(반환 타입 등)가 달라 그대로 빌드되지 않을 수 있다.
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:keyring]
build_src_filter = +<keyring/>

[env:roadside]
build_src_filter = +<roadside/>

; 키링(송신)을 Seeed XIAO nRF52840으로 바꾼 환경. 위 [env]의 ESP32 값을 덮어쓴다.
; Seeed 공식 PlatformIO 안내(wiki.seeedstudio.com/xiao_nrf52840_with_platform_io)의 구성.
; 플랫폼은 빌드를 확인한 1.1.1 태그 커밋으로 고정(Seeed nRF52 Boards core 1.1.1).
; 업로드: pio run -e keyring_xiao -t upload --upload-port <XIAO 포트>
[env:keyring_xiao]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#a6fd41debbbcda13b5340fff50c9092ed3289194
board = seeed-xiao-afruitnrf52-nrf52840
; 플랫폼 기본 툴체인(GCC 7.2.1)은 x86_64 전용이라 Rosetta 없는 Apple Silicon에서
; 실행되지 않는다(Bad CPU type). arm64 네이티브 빌드가 있는 가장 낮은 버전으로 바꾼다.
platform_packages = platformio/toolchain-gccarmnoneeabi@1.100301.220327
build_src_filter = +<keyring_xiao/>
