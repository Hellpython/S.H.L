; 어린이 키링 BLE 경고 1차 프로토타입
; 실제 보드 모델은 연구실에서 확인 전이다. 발표 자료의 "ESP32 DevKitC"를
; 가정해 esp32dev(ESP32-WROOM 계열)로 빌드한다. 보드가 다르면 board 값을 바꾼다.
;
; 빌드:  pio run -e keyring   /  pio run -e roadside
; 업로드: pio run -e keyring -t upload --upload-port <포트>

[env]
; 설치돼 있는 버전으로 고정 (Arduino-ESP32 core 2.0.17).
; core 3.x는 BLE API(반환 타입 등)가 달라 그대로 빌드되지 않을 수 있다.
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:keyring]
build_src_filter = +<keyring/>

[env:roadside]
build_src_filter = +<roadside/>
